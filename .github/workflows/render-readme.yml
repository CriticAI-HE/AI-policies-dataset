# .github/workflows/render-readme.yml
name: Render README.Rmd

on:
  push:
    branches: [main]
    paths:
      - 'README.Rmd'
      - '.github/workflows/render-readme.yml'
  pull_request:
    branches: [main]
    paths:
      - 'README.Rmd'

jobs:
  render-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Cache R packages
        uses: actions/cache@v4
        id: r-cache
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ hashFiles('**/DESCRIPTION') }}-${{ hashFiles('.github/workflows/render-readme.yml') }}
          restore-keys: |
            ${{ runner.os }}-r-

      - name: Install rmarkdown package
        run: |
          Rscript -e "if (!require('rmarkdown', quietly = TRUE)) install.packages('rmarkdown')"

      - name: Render README.Rmd to README.md
        run: |
          Rscript -e "rmarkdown::render('README.Rmd', output_file='README.md', quiet=TRUE)"

      - name: Check for changes
        id: git-check
        run: |
          if git diff --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit rendered README
        if: github.event_name == 'push' && steps.git-check.outputs.changes == 'true'
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add README.md
          git commit -m "[ci skip] Update README.md from README.Rmd"
          git push