name: Render README

on:
  push:
    branches: [main]
    paths:
      - 'README.Rmd'
      - '.github/workflows/render-readme.yml'

# Avoid pointless concurrent runs on rapid pushes to main
concurrency:
  group: render-readme-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    # Don't trigger an infinite loop when the bot's own commit pushes to main
    if: "!contains(github.event.head_commit.message, '[skip render]')"

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # need full history if you want git diff against previous commit,
          # but a shallow default checkout is fine for just comparing working tree
          fetch-depth: 1

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true  # pulls binary packages from Posit Package Manager (fast, no compiling)

      - name: Set up pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install R package dependencies (cached)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # extra-packages lets you avoid needing a DESCRIPTION file in the repo
          extra-packages: |
            any::rmarkdown
            any::knitr
          # cache-version bump invalidates cache manually if ever needed
          cache-version: 1

      - name: Render README.Rmd
        run: Rscript -e 'rmarkdown::render("README.Rmd", output_format = "github_document", output_file = "README.md")'

      - name: Commit and push if README.md changed
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- README.md; then
            echo "No changes to README.md, skipping commit."
            exit 0
          fi

          git add README.md
          git commit -m "Auto-render README.Rmd to README.md [skip render]"
          git push origin HEAD:main